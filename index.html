<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pokédex Interativa - Busque informações de qualquer Pokémon usando a PokeAPI">
  <meta name="author" content="Gabriel Paes">
  <title>Pokédex Interativa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>⚡ Pokédex Interativa</h1>
    <p>Busque por nome ou número (1-898)</p>
  </header>

  <div class="search-area">
    <input type="text" id="search-input" placeholder="Ex: pikachu, 25, charizard...">
    <button class="btn btn-search" id="btn-search">🔍 Buscar</button>
    <button class="btn btn-random" id="btn-random">🎲 Aleatório</button>
  </div>

  <main id="result-area">
  </main>

  <footer>
    <p>Desenvolvido por Gabriel Paes | Dados da <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokeAPI</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
